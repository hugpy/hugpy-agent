[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hugpy-agent"
version = "0.1.135.3"
description = "Portable agent runtime powered by the Hugpy self-hosted LLM fleet"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "putkoff", email = "support@hugpy.ai" }
]
keywords = ["hugpy", "agent", "llm", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]
# Near dependency-free: a remote machine with only Python can run it.
# abstract-toolserver is the CENTRAL toolserver client (stdlib-only core, no
# server stack): the one shared client/discovery every consumer pins
# (abstract-toolserver CENTRALIZATION.md, 2026-09-30).
dependencies = ["hugpy-resources>=0.1.2.4,<0.2", "hugpy-tools", "abstract-toolserver>=0.0.106", "hugpy-terminal>=0.1.9,<0.2"]

# Optional extras. No extra pins a vendor SDK (anthropic / openai / google …);
# the only abstract-* base dependency is the stdlib-only toolserver client above.
# Third-party CAPABILITIES plug in over the ``hugpy_agent.adapters`` entry-point
# group (see ``hugpy_agent/adapters.py``): install the provider package
# separately and it registers itself; hugpy-agent never imports it. For example
# the in-process local finder is provided by ``abstract-toolserver[files]`` (or
# any package that registers a ``local_search`` adapter); absent one, B degrades
# to the central HTTP finder.
#
# `pip install hugpy-agent[mct]` adds the Mediated Context Terminal
# (hugpy_agent.mct) and its only third-party dependency, jsonschema, used to
# validate the control-plane envelopes. mct code ships in the wheel but this dep
# installs only on request, so `import hugpy_agent.mct` requires the extra.
[project.optional-dependencies]
# `serve` is kept as an empty extra so existing installs of hugpy-agent[serve]
# keep resolving: the session server is hugpy-terminal's (a base dependency);
# abstract-serve-core is no longer used by this package.
serve = []
mct = ["jsonschema>=4.0"]
# `pip install hugpy-agent[console]` adds the standalone console server and its
# Flask route blueprint (hugpy_agent.routes / hugpy_agent.serve_fleet). The base
# package stays near dependency-free for remote boxes: get_toolset() and the
# toolset itself import NONE of these; only routes.py/serve_fleet.py do. The
# hugpy-agent .deb bundles this extra.
console = ["abstract-flask>=0.0.0.1052", "flask", "flask-cors"]

[project.urls]
Homepage = "https://hugpy.ai"
Repository = "https://github.com/hugpy/hugpy-agent"
Issues = "https://github.com/hugpy/hugpy-agent/issues"

[project.scripts]
hugpy-agent = "hugpy_agent.cli:main"
hugpy-agent-serve = "hugpy_agent.service.http:main"
# The standalone console server (UI at /fleet/ + /api/agent/* toolset API) is a
# subcommand, `hugpy-agent console-serve` (needs the [console] extra), not a
# separate script — see hugpy_agent.cli.cmd_console_serve.

# Register Hugpy among abstract-serve's providers (it loads providers ONLY from this
# entry-point group). The provider object is serve-core's own built-in front end to
# `hugpy-agent serve` on :9126; it moved from the removed `console` module to
# `abstract_serve_core.providers` (2026-10-24: the old path failed to import).
[project.entry-points."abstract_serve_core.providers"]
hugpy = "abstract_serve_core.providers:hugpy"

# Agent arm discovery. A host (hugpy-core, or the standalone server) loads the
# arm by these entry points: `hugpy.toolsets` gives the dependency-light
# {category:{route:callable}} dict; `hugpy.arms` gives the ready Flask blueprint
# (importing it needs the [console] extra). Categories live under `agent`, so the
# UI's /api/agent/* is clear of core's own routes. (Core PROXIES to the running
# service via /usr/share/hugpy/arms.d/agent.json; these are for an in-process host.)
[project.entry-points."hugpy.toolsets"]
agent = "hugpy_agent.toolset:get_toolset"

[project.entry-points."hugpy.arms"]
agent = "hugpy_agent.routes:fleet_bp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hugpy_agent" = ["ui_dist/**/*"]
"hugpy_agent.service" = ["index.html"]
"hugpy_agent.mct" = ["schemas/*.json"]
