<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hugpy Agent · Serve</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#0c1016;color:#e7edf5}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex}aside{width:230px;padding:18px;background:#111822;border-right:1px solid #273344;overflow:auto}h1{font-size:17px;margin:0 0 18px}button,select,input,textarea{font:inherit;color:inherit;background:#192433;border:1px solid #35465b;border-radius:7px;padding:9px}button{cursor:pointer}button:hover{background:#273a50}button:disabled{opacity:.45;cursor:default}select{width:100%;margin:0 0 10px}#sessions button{display:block;width:100%;text-align:left;margin:8px 0;overflow:hidden;text-overflow:ellipsis}#sessions button.active{border-color:#76b9ee}main{flex:1;min-width:0;display:flex;flex-direction:column}header{padding:13px 20px;border-bottom:1px solid #273344;display:flex;gap:12px;align-items:center}#status{flex:1;color:#a4b7cc}#chat{flex:1;overflow:auto;padding:20px;scroll-behavior:smooth}.message{max-width:900px;margin:0 auto 16px;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}.user{background:#1e3046;padding:12px 16px;border-radius:9px}.reply{padding:12px 4px}.progress{color:#a4b7cc;font-size:13px}details{max-width:900px;margin:8px auto;color:#a4b7cc}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}footer{padding:15px 20px;border-top:1px solid #273344}form{display:flex;gap:10px}textarea{flex:1;resize:vertical;min-height:68px}#question{max-width:900px;margin:auto;padding:10px;background:#253246}#question button{margin:6px}#error{color:#ffb7ae;white-space:pre-wrap;margin-bottom:8px}#auth{max-width:900px;margin:10px auto}small{color:#93a8c0}#new{width:100%}@media(max-width:650px){aside{width:150px;padding:10px}header,footer,#chat{padding:10px}}
</style>
<aside><h1>Hugpy Agent</h1><label for="profile">Session model</label><select id="profile"></select><button id="new">New session</button><div id="sessions"></div></aside>
<main><header><span id="status">Connecting…</span><button id="resume" hidden>Resume run</button><button id="stop" disabled>Stop</button></header>
<div id="auth" hidden><label>Service token <input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button></div>
<div id="chat" role="log" aria-live="polite"></div><div id="question" hidden></div><footer><div id="error" role="alert"></div><form id="send"><textarea id="prompt" aria-label="Message" placeholder="Describe what you want to do…" required></textarea><button id="submit">Send</button></form><small id="scope"></small></footer></main>
<script>
const $=id=>document.getElementById(id);let current=null,cursor=0,busy=false,loading=false,progress=null,pendingId=null,auth='',profiles=[];
// Every URL is relative: the identical UI works standalone and under any Station locus prefix.
async function api(path,body){const r=await fetch('api/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth}:{})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(r.status===401)$('auth').hidden=false;if(!r.ok)throw Error(d.error||r.statusText);$('auth').hidden=true;return d}
function fail(e){$('error').textContent=e.message}
function add(kind,text){const e=document.createElement('div');e.className='message '+kind;e.textContent=text;$('chat').append(e);return e}
function event(e){const d=e.data;if(e.kind==='user'){progress=null;add('user',d)}else if(e.kind==='delta'){if(!progress)progress=add('progress','');progress.textContent+=d}else if(e.kind==='assistant'){if(progress)progress.remove();progress=null;const detail=document.createElement('details');const title=document.createElement('summary');title.textContent='Agent step';const p=document.createElement('pre');p.textContent=typeof d==='string'?d:JSON.stringify(d,null,2);detail.append(title,p);$('chat').append(detail)}else if(e.kind==='reply'){if(progress)progress.remove();progress=null;add('reply',d)}else if(['tool','toolserver','policy','client','chat_error','client_error','model','done'].includes(e.kind)){const detail=document.createElement('details');const title=document.createElement('summary');title.textContent=e.kind==='done'?'Turn '+d.outcome:e.kind;const p=document.createElement('pre');p.textContent=JSON.stringify(d,null,2);detail.append(title,p);$('chat').append(detail)}}
async function refreshList(){const d=await api('state');profiles=d.profiles;const value=$('profile').value||d.config.default_profile;$('profile').replaceChildren();for(const p of profiles){const o=document.createElement('option');o.value=p.id;o.textContent=p.label+(p.available?'':' · '+p.reason);o.disabled=!p.available;$('profile').append(o)}$('profile').value=value;$('scope').textContent='Workspace: '+d.workspace;$('sessions').replaceChildren();for(const s of d.sessions){const b=document.createElement('button');b.textContent=s.profile+' · '+s.id.slice(0,6)+' · '+s.status;b.className=current===s.id?'active':'';b.onclick=()=>select(s.id);$('sessions').append(b)}if(!current)$('status').textContent='Choose a model and start a session';return d}
async function select(id){localStorage.setItem('hugpy-serve-session',id);current=id;cursor=0;progress=null;pendingId=null;$('chat').replaceChildren();$('error').textContent='';await poll();await refreshList()}
async function poll(){if(!current||loading)return;loading=true;const id=current;try{const s=await api('sessions/'+id+'?after='+cursor);if(id!==current)return;const nearBottom=$('chat').scrollHeight-$('chat').scrollTop-$('chat').clientHeight<100;for(const e of s.events){event(e);cursor=e.id}if(nearBottom)$('chat').scrollTop=$('chat').scrollHeight;busy=['running','waiting','stopping'].includes(s.status);$('status').textContent=s.profile+' · '+s.status;$('profile').value=s.profile;$('profile').disabled=busy;$('stop').disabled=!busy;$('submit').disabled=busy;$('resume').hidden=s.status!=='interrupted'||!s.run_id;const q=s.pending;$('question').hidden=!q;if(q&&pendingId!==q.id){pendingId=q.id;$('question').replaceChildren();const p=document.createElement('p');p.textContent=q.question;$('question').append(p);for(const choice of q.options){const b=document.createElement('button');b.textContent=choice;b.onclick=async()=>{try{await api('sessions/'+id+'/answer',{id:q.id,choice});pendingId=null;await poll()}catch(e){fail(e)}};$('question').append(b)}if(!q.options.includes('Approve')){const input=document.createElement('input');input.placeholder='Your answer';const b=document.createElement('button');b.textContent='Answer';b.onclick=()=>api('sessions/'+id+'/answer',{id:q.id,choice:input.value}).then(()=>{pendingId=null}).catch(fail);$('question').append(input,b)}}if(!q)pendingId=null}catch(e){fail(e)}finally{loading=false}}
$('profile').onchange=async()=>{if(current){try{await api('sessions/'+current+'/profile',{profile:$('profile').value});await poll()}catch(e){fail(e);await poll()}}};
$('new').onclick=async()=>{try{const s=await api('sessions',{profile:$('profile').value});await select(s.id)}catch(e){fail(e)}};
$('send').onsubmit=async e=>{e.preventDefault();try{if(!current){const s=await api('sessions',{profile:$('profile').value});await select(s.id)}await api('sessions/'+current+'/messages',{text:$('prompt').value});$('prompt').value='';$('error').textContent='';await poll()}catch(e){fail(e)}};
$('stop').onclick=()=>api('sessions/'+current+'/stop',{}).then(poll).catch(fail);
$('resume').onclick=()=>api('sessions/'+current+'/resume',{}).then(poll).catch(fail);
async function start(){const d=await refreshList();const saved=localStorage.getItem('hugpy-serve-session');if(saved&&d.sessions.some(s=>s.id===saved))await select(saved)}
$('connect').onclick=()=>{auth=$('token').value;$('token').value='';start().catch(fail)};
start().catch(fail);setInterval(poll,1000);setInterval(()=>refreshList().catch(fail),6000);
</script></html>
